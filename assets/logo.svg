<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="controlesque logo">
  <defs>
    <linearGradient id="outer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e2e34"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Outer keycap base -->
  <rect x="10" y="10" width="140" height="140" rx="30" fill="url(#outer)" stroke="#3f3f46" stroke-width="2"/>

  <!-- Sculpted inner keycap face -->
  <rect x="22" y="20" width="116" height="114" rx="20" fill="url(#cap)" stroke="#3f3f46" stroke-width="1.2"/>

  <!-- Subtle Caps-Lock-style status dot (accent) -->
  <circle cx="40" cy="38" r="3.5" fill="url(#accent)"/>

  <!-- Minimal diagonal split line -->
  <line x1="42" y1="114" x2="118" y2="38" stroke="#3f3f46" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Top-left: ESC (tap) -->
  <text x="54" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="0.06em" fill="url(#accent)">ESC</text>

  <!-- Bottom-right: CTRL (hold) -->
  <text x="102" y="110" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="0.06em" fill="#f4f4f5">CTRL</text>
</svg>
